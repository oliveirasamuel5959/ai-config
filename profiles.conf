# Profiles — which component directories a sync installs
#
# Consumed by sync.sh. Each profile lists component roots, one per line;
# blank lines and lines starting with '#' are ignored.
#
# Every component root is a directory that may contain any of:
#   skills/<name>/SKILL.md        -> shared by both tools
#   agents/*.md                   -> Claude Code agents (flat)
#   agents/opencode/*.md          -> OpenCode agents (flat, per-tool frontmatter)
#   commands/*.md                 -> shared commands
#   commands/opencode/*.md        -> OpenCode command variants

[core]
core

[software-dev]
core
domains/software-dev

[data-science]
core
domains/data-science

[all]
core
domains/software-dev
domains/data-science
